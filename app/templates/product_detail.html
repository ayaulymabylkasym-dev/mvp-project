{% extends "base.html" %}
{% block title %}{{ product[2] }}{% endblock %}
{% block content %}
<h1>{{ product[2] }}</h1>
{% if product[6] %}
<img src="{{ product[6] }}" alt="{{ product[2] }}" style="max-width: 100%; height: 300px; object-fit: cover; border-radius: 6px; margin-bottom: 20px;">
{% endif %}
<p><b>Қысқаша:</b> {{ product[3] }}</p>
<h3>Толық сипаттамасы:</h3>
<p>{{ product[4] }}</p>
<p><b>Бағасы / Моделі:</b> {{ product[5] }} ₸</p>
<p style="margin-top: 30px;">
    <a href="{{ url_for('products') }}" class="btn" style="background: #6c757d;">Каталогқа қайту</a>
</p>
{% endblock %}
