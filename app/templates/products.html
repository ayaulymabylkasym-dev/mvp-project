{% extends "base.html" %}
{% block title %}Туристік каталог{% endblock %}
{% block content %}
<h2>Саяхаттар каталогы (Standby серверден оқылды)</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px;">
    {% for p in products %}
    <div style="border: 1px solid #ddd; border-radius: 6px; padding: 15px; background: #fff;">
        {% if p[5] %}
        <img src="{{ p[5] }}" alt="{{ p[2] }}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 4px;">
        {% endif %}
        <h3>{{ p[2] }}</h3>
        <p>{{ p[3] }}</p>
        <p><b>Бағасы:</b> {{ p[4] }} ₸</p>
        <a href="{{ url_for('product_detail', slug=p[1]) }}" class="btn">Толығырақ</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
