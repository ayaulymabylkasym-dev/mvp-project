{% extends "base.html" %}
{% block title %}Тіркелу{% endblock %}
{% block content %}
<h2>Жүйеге тіркелу</h2>
{% if error %}
    <div class="error">{{ error }}</div>
{% endif %}
<form method="POST">
    <label>Аты-жөніңіз:</label>
    <input type="text" name="full_name" required placeholder="Толық аты-жөніңіз">
    
    <label>Email:</label>
    <input type="email" name="email" required placeholder="example@domain.kz">
    
    <label>Пароль:</label>
    <input type="password" name="password" required placeholder="Құпия сөзді енгізіңіз">
    
    <button type="submit" class="btn">Тіркелу</button>
</form>
<p>Аккаунтыңыз бар ма? <a href="{{ url_for('login') }}">Кіру</a></p>
{% endblock %}
