x-web-base: &web-base
  build: ./app
  environment:
    WRITE_DB_URL: postgresql://appuser:apppass@postgres_primary:5432/projectdb
    READ_DB_URL: postgresql://appuser:apppass@postgres_standby:5432/projectdb
    SECRET_KEY: ${SECRET_KEY}
    GITHUB_URL: ${GITHUB_URL}
    ADMIN_EMAIL: ${ADMIN_EMAIL}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  expose:
    - "5000"
  depends_on:
    postgres_primary:
      condition: service_healthy
    postgres_standby:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
    interval: 5s
    timeout: 3s
    retries: 15

services:
  postgres_primary:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projectdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "wal_keep_size=128MB"]
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d projectdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_standby:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projectdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    depends_on:
      postgres_primary:
        condition: service_healthy
    volumes:
      - standby_data:/var/lib/postgresql/data
      - ./standby/setup-standby.sh:/setup-standby.sh:ro
    entrypoint: ["sh", "/setup-standby.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d projectdb"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  web:
    <<: *web-base

  web_replica:
    <<: *web-base
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "app:app"]
    depends_on:
      postgres_primary:
        condition: service_healthy
      postgres_standby:
        condition: service_healthy
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./app/static:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy
      web_replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  primary_data:
  standby_data: